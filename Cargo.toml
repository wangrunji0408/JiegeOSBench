[package]
name = "jiege-kernel"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
linked_list_allocator = "0.10.5"
spin = "0.9.8"
smoltcp = { version = "0.12.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
