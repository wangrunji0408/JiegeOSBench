[package]
name = "ijiege-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2"
lazy_static = { version = "1", features = ["spin_no_std"] }
spin = "0.9"
buddy_system_allocator = "0.9"
xmas-elf = "0.9"
smoltcp = { version = "0.11", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
] }

[profile.release]
opt-level = 2
debug = true
panic = "abort"

[profile.dev]
panic = "abort"
