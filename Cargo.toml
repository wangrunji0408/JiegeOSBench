[package]
name = "jiege-os"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9"
linked_list_allocator = "0.10"
smoltcp = { version = "0.12", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }

[profile.release]
panic = "abort"
lto = true
opt-level = 2
debug = true

[profile.dev]
panic = "abort"
opt-level = 1
