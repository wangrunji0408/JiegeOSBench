[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = true
lto = false

[dependencies]
spin = "0.9"
linked_list_allocator = "0.10"
virtio-drivers = "0.7"

[dependencies.smoltcp]
version = "0.11"
default-features = false
features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"]
