[package]
name = "ijiege-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9"
buddy_system_allocator = "0.11"
linked_list_allocator = "0.10"
smoltcp = { version = "0.11", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "alloc"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = true
