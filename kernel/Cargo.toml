[package]
name = "ijiege-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
smoltcp = { version = "0.11.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
] }

[profile.release]
opt-level = 2
lto = true
panic = "abort"
debug = true
