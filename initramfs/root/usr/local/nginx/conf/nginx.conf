worker_processes  1;
pid               /usr/local/nginx/logs/nginx.pid;
error_log         stderr info;
daemon            off;

events {
    worker_connections  128;
}

http {
    access_log    /usr/local/nginx/logs/access.log;
    sendfile      off;
    tcp_nopush    on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        location / {
            root   /usr/local/nginx/html;
            index  index.html;
        }
    }
}
