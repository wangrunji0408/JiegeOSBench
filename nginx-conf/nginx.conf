worker_processes 1;
daemon off;
master_process off;
error_log /dev/null;
pid /run/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /www;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
